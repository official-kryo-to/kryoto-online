name: Pull Request Build

# The same build the release runs, minus the publishing. It shares the
# composite action rather than repeating it, so a step added to one is
# not quietly missing from the other.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - id: build
        uses: ./.github/actions/build
        with:
          label: pr

      # A version bump in a PR is what will trigger a release the moment
      # it merges, so it is worth saying out loud in the checks rather
      # than discovering it from a surprise GitHub release.
      - name: Report the release this would cut
        shell: bash
        run: |
          version=$(sed -n 's/^#define KRYOTOO_VERSION_STR "\(.*\)"$/\1/p' include/version.h)
          echo "include/version.h says $version"
          if git ls-remote --tags --exit-code origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::notice::v$version is already released. Merging this will NOT cut a release."
          else
            echo "::notice::v$version has no tag yet. Merging this to master WILL cut a release - make sure CHANGELOG.md has a $version section."
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryoto-online-pr-release
          path: ${{ steps.build.outputs.release-zip }}
          if-no-files-found: error

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryoto-online-pr-debug
          path: ${{ steps.build.outputs.debug-zip }}
          if-no-files-found: error
