name: Release

# Fires on a VERSION BUMP, not on every push.
#
# The job reads KRYOTOO_VERSION_STR out of include/version.h and stops
# unless that version has no tag yet. So the release ritual is: edit the
# version, write the CHANGELOG entry, push. No tagging by hand, and no
# accidental release from an unrelated commit.
#
# This used to run on every push to master AND on any `v*` tag, naming
# the release after `github.ref_name`. A push to master is not a tag, so
# it published a GitHub release literally called `master`, tagged
# `master`, over and over - which is where the `master` and `test` tags
# in this repository came from. Kryoto Forge then installed
# `kryoto-online-master-debug.zip` as if it were a version.
on:
  push:
    branches: [master]
    paths:
      - 'include/version.h'
      - '.github/workflows/release.yml'
      - '.github/actions/build/action.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, so the "already released?" check can see them.
          fetch-depth: 0

      - id: v
        shell: bash
        run: |
          version=$(sed -n 's/^#define KRYOTOO_VERSION_STR "\(.*\)"$/\1/p' include/version.h)
          if [ -z "$version" ]; then
            echo "::error::No KRYOTOO_VERSION_STR in include/version.h."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; nothing to release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # Release notes come from the CHANGELOG entry for this version, so
      # the notes and the file cannot disagree.
      - id: notes
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const src = fs.readFileSync("include/version.h", "utf8");
            const version = /#define KRYOTOO_VERSION_STR "(.*)"/.exec(src)[1];
            const raw = fs.readFileSync("CHANGELOG.md", "utf8");

            let capturing = false;
            const body = [];
            for (const line of raw.split(/\r?\n/)) {
              if (line.startsWith("## ")) {
                const heading = line.replace(/^##\s+/, "").trim();
                if (!capturing && (heading.startsWith("[" + version + "]") || heading.startsWith(version))) {
                  capturing = true;
                  continue;
                }
                if (capturing) break;
              } else if (capturing) {
                body.push(line);
              }
            }

            const text = body.join("\n").trim() || "See CHANGELOG.md for what changed.";
            const delim = "DELIMITER_" + crypto.randomBytes(8).toString("hex");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes<<${delim}\n${text}\n${delim}\n`);
          '

  release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - id: build
        uses: ./.github/actions/build
        with:
          label: v${{ needs.check.outputs.version }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryoto-online-v${{ needs.check.outputs.version }}-release
          path: ${{ steps.build.outputs.release-zip }}
          if-no-files-found: error

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryoto-online-v${{ needs.check.outputs.version }}-debug
          path: ${{ steps.build.outputs.debug-zip }}
          if-no-files-found: error

      # Creates the tag as well - nothing tags by hand.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: KryotoOnline v${{ needs.check.outputs.version }}
          body: ${{ needs.check.outputs.notes }}
          files: |
            ${{ steps.build.outputs.release-zip }}
            ${{ steps.build.outputs.debug-zip }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
